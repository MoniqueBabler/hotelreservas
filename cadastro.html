<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hotel Reservas - Cadastro de Quarto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <header>
        <div class="logo">🏨 Hotel Reservas</div>
    </header>

    <div class="container">
        <form id="formQuarto">
            <h2>Cadastro de Quarto</h2>
            <p>Informe os dados do novo quarto</p>

            <div class="form-group">
                <label for="numero">Número do Quarto</label>
                <input type="text" id="numero" placeholder="Ex: 101" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo do Quarto</label>
                <select id="tipo" required>
                    <option value="" disabled selected>Selecione o tipo</option>
                    <option value="Standard">Standard</option>
                    <option value="Luxo">Luxo</option>
                    <option value="Suíte">Suíte</option>
                </select>
            </div>

            <button type="submit">Cadastrar</button>
            <button type="button" class="btn-back" onclick="window.location.href='index.html'">Voltar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
